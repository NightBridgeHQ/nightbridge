[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/protocol-localsend-v2",
  "crates/protocol-native-v1",
  "crates/daemon",
  "crates/cli",
  "crates/tui",
  "crates/webui",
  "crates/gui",
  "crates/rendezvous",
  "crates/proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/<owner>/localsend-improvements"
rust-version = "1.78"

[workspace.dependencies]
# Async
tokio = { version = "1.38", features = ["full"] }
# CLI
clap = { version = "=4.5.0", features = ["derive"] }
# Errors
thiserror = "1.0"
anyhow = "1.0"
# Crypto
ed25519-dalek = { version = "=2.1.1", features = ["rand_core", "serde"] }
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Filesystem helpers
directories = "5.0"
# Tests
tempfile = "=3.10.1"
proptest = "=1.4.0"
assert_cmd = "=2.0.14"
predicates = "=3.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
