[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/protocol-localsend-v2",
  "crates/protocol-native-v1",
  "crates/daemon",
  "crates/cli",
  "crates/tui",
  "crates/webui",
  "crates/gui",
  "crates/rendezvous",
  "crates/proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/<owner>/localsend-improvements"
rust-version = "1.78"

[workspace.dependencies]
# Async
tokio = { version = "1.38", features = ["full"] }
tokio-rustls = "=0.26.0"
tokio-util = { version = "=0.7.10", features = ["io"] }
bytes = "=1.11.1"
# CLI
clap = { version = "=4.5.0", features = ["derive"] }
crossterm = "=0.27.0"
ratatui = "=0.26.3"
# HTTP
axum = "=0.7.5"
async-stream = "=0.3.6"
futures-util = "=0.3.31"
http = "=1.1.0"
hyper = "=1.3.1"
hyper-util = { version = "=0.1.4", features = ["server", "http1", "http2", "tokio", "service"] }
reqwest = { version = "=0.12.4", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "=2.5.2"
# Errors
thiserror = "1.0"
anyhow = "1.0"
# Crypto
ed25519-dalek = { version = "=2.1.1", features = ["rand_core", "serde"] }
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
blake3 = "=1.5.1"
rcgen = "=0.13.1"
rustls = { version = "=0.23.5", features = ["ring"] }
time = "=0.3.36"
# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
indexmap = "=2.2.6"
# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# File/media helpers
mime_guess = "=2.0.4"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Network helpers
socket2 = "=0.5.7"
quinn = { version = "=0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
mdns-sd = "=0.19.1"
# Wire encoding
prost = "=0.13.5"
prost-types = "=0.13.5"
tonic = { version = "=0.12.3", features = ["transport"] }
tonic-build = "=0.12.3"
tokio-stream = { version = "=0.1.17", features = ["net"] }
# Filesystem helpers
directories = "5.0"
rust-embed = "=8.3.0"
# IDs
uuid = { version = "=1.8.0", features = ["v4", "serde"] }
# Tests
tempfile = "=3.10.1"
proptest = "=1.4.0"
assert_cmd = "=2.0.14"
predicates = "=3.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
