[package]
name = "lsi-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tauri desktop GUI for NightBridge"

[[bin]]
name = "night-bridge-gui"
path = "src/main.rs"

[dependencies]
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.0.0", features = [] }
thiserror.workspace = true
url.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
# Tauri CLI enables tauri/native-tls for release bundles. Keep these pinned
# with the Tauri 2.0 stack until the desktop bundle is upgraded as a unit.
native-tls = "=0.2.18"
security-framework = "=2.11.1"

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dev-dependencies]
tempfile.workspace = true
