syntax = "proto3";

package lsi.daemon.v1;

import "lsi/common/v1/common.proto";

service DaemonService {
  rpc GetStatus(lsi.common.v1.Empty) returns (DaemonStatus);
}

message DaemonStatus {
  string alias = 1;
  string fingerprint = 2;
  string version = 3;
  string inbox_dir = 4;
  uint32 localsend_port = 5;
  uint32 native_port = 6;
}
