[package]
name = "lsi-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Headless daemon for NightBridge"

[[bin]]
name = "night-bridge-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
clap.workspace = true
hmac.workspace = true
lsi-core = { path = "../core" }
lsi-proto = { path = "../proto" }
lsi-rendezvous = { path = "../rendezvous" }
lsi-protocol-localsend-v2 = { path = "../protocol-localsend-v2" }
lsi-protocol-native-v1 = { path = "../protocol-native-v1" }
lsi-webui = { path = "../webui" }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
quinn.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-util.workspace = true
rustls.workspace = true
tempfile.workspace = true

[package.metadata.deb]
name = "night-bridge-daemon"
maintainer = "NightBridge maintainers"
copyright = "2026 NightBridge contributors"
license-file = ["../../LICENSE", "0"]
depends = "$auto"
section = "net"
priority = "optional"
maintainer-scripts = "../../packaging/deb"
assets = [
  ["../../target/release/night-bridge-daemon", "usr/bin/night-bridge-daemon", "755"],
  ["../../packaging/systemd/night-bridge.service", "lib/systemd/system/night-bridge.service", "644"],
  ["../../packaging/deb/config.toml", "etc/night-bridge/config.toml", "644"],
]

[package.metadata.generate-rpm]
name = "night-bridge-daemon"
summary = "Headless daemon for NightBridge"
license = "AGPL-3.0-only"
url = "https://github.com/<owner>/localsend-improvements"

[[package.metadata.generate-rpm.assets]]
source = "../../target/release/night-bridge-daemon"
dest = "/usr/bin/night-bridge-daemon"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "../../packaging/systemd/night-bridge.service"
dest = "/usr/lib/systemd/system/night-bridge.service"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "../../packaging/rpm/config.toml"
dest = "/etc/night-bridge/config.toml"
mode = "644"
config = true
