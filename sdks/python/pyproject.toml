[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "localsend-improved"
version = "0.1.0"
description = "Python SDK skeleton for the LocalSend Improved local API."
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "LocalSend Improved contributors" }
]
dependencies = []

[project.optional-dependencies]
generation = [
  "betterproto[compiler]>=2.0.0b6",
  "grpcio-tools>=1.62"
]

[tool.hatch.build.targets.wheel]
packages = ["src/localsend_improved"]
