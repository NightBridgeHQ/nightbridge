[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "night-bridge"
version = "0.1.0"
description = "Python SDK skeleton for the NightBridge local API."
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "NightBridge contributors" }
]
dependencies = []

[project.optional-dependencies]
generation = [
  "betterproto[compiler]>=2.0.0b6",
  "grpcio-tools>=1.62"
]
test = [
  "pytest>=8.2"
]
dev = [
  "betterproto[compiler]>=2.0.0b6",
  "grpcio-tools>=1.62",
  "pytest>=8.2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nightbridge"]
