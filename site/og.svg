<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101816"/>
      <stop offset="1" stop-color="#0a4f47"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58c7b7"/>
      <stop offset="1" stop-color="#86bff4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- logo -->
  <g transform="translate(96,104) scale(2.1)">
    <circle cx="24" cy="24" r="20" fill="none" stroke="#58c7b7" stroke-width="2.2"/>
    <path d="M12 29c3.4-6.7 7.4-10 12-10s8.6 3.3 12 10" fill="none" stroke="#8de3d4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
    <path d="M10.5 29h27" fill="none" stroke="#8de3d4" stroke-linecap="round" stroke-width="2.4"/>
    <path d="M17 29v5.5" fill="none" stroke="#8de3d4" stroke-linecap="round" stroke-width="1.8"/>
    <path d="M24 29v5.5" fill="none" stroke="#8de3d4" stroke-linecap="round" stroke-width="1.8"/>
    <path d="M31 29v5.5" fill="none" stroke="#8de3d4" stroke-linecap="round" stroke-width="1.8"/>
    <circle cx="13" cy="34.5" r="2" fill="#101816" stroke="#8de3d4" stroke-width="1.7"/>
    <circle cx="35" cy="34.5" r="2" fill="#101816" stroke="#8de3d4" stroke-width="1.7"/>
  </g>
  <text x="200" y="150" fill="#edf5f0" font-size="40" font-weight="800">NightBridge</text>
  <text x="200" y="192" fill="#58c7b7" font-size="22" font-weight="600" letter-spacing="2">SELF-HOSTED · OPEN SOURCE · LAN-ONLY</text>

  <text x="96" y="330" fill="#ffffff" font-size="68" font-weight="800">Receive LocalSend files</text>
  <text x="96" y="408" fill="#ffffff" font-size="68" font-weight="800">on headless servers.</text>

  <rect x="96" y="470" width="1008" height="3" fill="url(#bridge)"/>
  <text x="96" y="540" fill="#a7b8ae" font-size="30" font-weight="500">A LocalSend-compatible daemon for your NAS, homelab, or Pi.</text>
  <text x="96" y="588" fill="#86bff4" font-size="26" font-weight="600" font-family="'IBM Plex Mono',ui-monospace,monospace">nightbridge.dev</text>
