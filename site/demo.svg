<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 432" role="img" aria-label="NightBridge daemon receiving files over the LAN">
<style>text{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;white-space:pre}.ln{opacity:0}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{animation:blink 1s steps(1) infinite}@media(prefers-reduced-motion:reduce){.ln{opacity:1!important;animation:none!important}.cursor{animation:none!important}}@keyframes a0{0%,0.0%{opacity:0}1.50%,94%{opacity:1}100%{opacity:0}}.l0{animation:a0 15.0s ease-in infinite}@keyframes a1{0%,6.6%{opacity:0}8.10%,94%{opacity:1}100%{opacity:0}}.l1{animation:a1 15.0s ease-in infinite}@keyframes a2{0%,13.2%{opacity:0}14.70%,94%{opacity:1}100%{opacity:0}}.l2{animation:a2 15.0s ease-in infinite}@keyframes a3{0%,19.8%{opacity:0}21.30%,94%{opacity:1}100%{opacity:0}}.l3{animation:a3 15.0s ease-in infinite}@keyframes a4{0%,26.4%{opacity:0}27.90%,94%{opacity:1}100%{opacity:0}}.l4{animation:a4 15.0s ease-in infinite}@keyframes a5{0%,33.0%{opacity:0}34.50%,94%{opacity:1}100%{opacity:0}}.l5{animation:a5 15.0s ease-in infinite}@keyframes a6{0%,39.6%{opacity:0}41.10%,94%{opacity:1}100%{opacity:0}}.l6{animation:a6 15.0s ease-in infinite}@keyframes a7{0%,46.2%{opacity:0}47.70%,94%{opacity:1}100%{opacity:0}}.l7{animation:a7 15.0s ease-in infinite}@keyframes a8{0%,52.8%{opacity:0}54.30%,94%{opacity:1}100%{opacity:0}}.l8{animation:a8 15.0s ease-in infinite}@keyframes a9{0%,59.4%{opacity:0}60.90%,94%{opacity:1}100%{opacity:0}}.l9{animation:a9 15.0s ease-in infinite}@keyframes a10{0%,66.0%{opacity:0}67.50%,94%{opacity:1}100%{opacity:0}}.l10{animation:a10 15.0s ease-in infinite}</style>
