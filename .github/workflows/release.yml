name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      sign_artifacts:
        description: "Attempt signing/notarization when required secrets are configured"
        required: false
        default: false
        type: boolean

# Least privilege by default; jobs that need to write packages or releases
# opt in explicitly below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HEADLESS_PACKAGES: >-
    -p lsi-core
    -p lsi-proto
    -p lsi-protocol-localsend-v2
    -p lsi-protocol-native-v1
    -p lsi-daemon
    -p lsi-cli
    -p lsi-tui
    -p lsi-webui
    -p lsi-rendezvous

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check
      - run: cargo test $HEADLESS_PACKAGES
      - run: cargo build $HEADLESS_PACKAGES --release

  webui:
    name: WebUI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/webui/package-lock.json
      - run: npm ci --prefix crates/webui
      - run: npm run check --prefix crates/webui
      - run: npm run build --prefix crates/webui

  docker:
    name: Docker build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Resolve GHCR image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -t "night-bridge:${{ github.ref_name }}" -t "$IMAGE:${{ github.ref_name }}" .
      - name: Push to GHCR
        # Only push for real tag releases; PR/dispatch runs build-only.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Immutable, per-version tag.
          docker push "$IMAGE:${{ github.ref_name }}"
          # Point the moving :develop tag at this build. At release time main and
          # develop are aligned, so :develop tracks the newest image. A future
          # nightly workflow (push to develop) will advance :develop on its own;
          # the per-version tag above always stays immutable.
          docker tag "$IMAGE:${{ github.ref_name }}" "$IMAGE:develop"
          docker push "$IMAGE:develop"

  archives:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-amd64
            runner: macos-13
          - platform: macos-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install protoc
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf
          else
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi
      - name: Build release binaries
        run: cargo build --release -p lsi-daemon -p lsi-cli -p lsi-tui
      - name: Archive binaries
        # Strip a leading "v" so asset names match what install.sh requests
        # (install.sh downloads nightbridge-${version#v}-<platform>.tar.gz).
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash packaging/release/archive-binaries.sh "$version" dist "${{ matrix.platform }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  deb:
    name: Debian package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-deb --version 3.6.2 --locked
      - run: bash packaging/build-packages.sh --deb-only
      - name: Stage .deb
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: mkdir -p dist
      - run: bash packaging/release/sbom.sh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/sbom.cdx.json
          if-no-files-found: error

  signing:
    name: Signing and notarization gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.sign_artifacts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Explain signing requirements
        run: |
          echo "Artifact signing is opt-in and requires platform credentials."
          echo "macOS notarization requires Apple Developer secrets on macOS runners."
          echo "Windows Authenticode requires certificate secrets on Windows runners."
          echo "Detached signatures require a configured signing key."
          test -n "${{ secrets.RELEASE_SIGNING_KEY }}" || {
            echo "missing: RELEASE_SIGNING_KEY"
            exit 1
          }

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    # Only publish for real tag pushes; workflow_dispatch runs validate only.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [rust, webui, docker, archives, deb, sbom]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Stage installer as a release asset
        run: cp install.sh dist/install.sh
      - name: Generate checksums
        run: bash packaging/release/checksums.sh dist
      - name: List release assets
        run: ls -la dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # CalVer pre-releases carry a hyphenated qualifier (e.g. -alpha.1);
          # mark them as pre-releases on GitHub.
          prerelease_flag=""
          case "$TAG" in
            *-*) prerelease_flag="--prerelease" ;;
          esac

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading assets with --clobber"
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "NightBridge $TAG" \
              --generate-notes \
              $prerelease_flag \
              dist/*
          fi
