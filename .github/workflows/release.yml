name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo build --workspace --release

  webui:
    name: WebUI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/webui/package-lock.json
      - run: npm ci --prefix crates/webui
      - run: npm run check --prefix crates/webui
      - run: npm run build --prefix crates/webui

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t localsend-improved:${{ github.ref_name }} .

  packages:
    name: Linux package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: bash packaging/build-packages.sh

  checksums:
    name: Checksum generation
    runs-on: ubuntu-latest
    needs: [rust, webui, docker, packages]
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p dist
      - run: bash packaging/release/checksums.sh dist
