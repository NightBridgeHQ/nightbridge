name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  HEADLESS_PACKAGES: >-
    -p lsi-core
    -p lsi-proto
    -p lsi-protocol-localsend-v2
    -p lsi-protocol-native-v1
    -p lsi-daemon
    -p lsi-cli
    -p lsi-tui
    -p lsi-webui
    -p lsi-rendezvous
  WINDOWS_PACKAGES: >-
    -p lsi-core
    -p lsi-proto
    -p lsi-protocol-localsend-v2
    -p lsi-protocol-native-v1
    -p lsi-cli
    -p lsi-tui
    -p lsi-webui
    -p lsi-rendezvous

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-audit --version 0.22.1 --locked
      # Fails the build on RUSTSEC vulnerability advisories; informational
      # (unmaintained/unsound) advisories are reported but do not fail.
      - run: cargo audit

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy $HEADLESS_PACKAGES --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Select package set
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "PACKAGE_SET=$WINDOWS_PACKAGES" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_SET=$HEADLESS_PACKAGES" >> "$GITHUB_ENV"
          fi
      - run: cargo test $PACKAGE_SET --all-features

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Select package set
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "PACKAGE_SET=$WINDOWS_PACKAGES" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_SET=$HEADLESS_PACKAGES" >> "$GITHUB_ENV"
          fi
      - if: matrix.cross
        run: cargo install cross --locked
      - if: matrix.cross
        run: cross build $PACKAGE_SET --release --target ${{ matrix.target }}
      - if: '!matrix.cross'
        run: cargo build $PACKAGE_SET --release --target ${{ matrix.target }}

  interop-localsend:
    name: LocalSend interop smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: bash scripts/localsend-interop-smoke.sh

  gui-smoke:
    name: GUI smoke (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/webui/package-lock.json
      - run: npm ci --prefix crates/webui
      - run: bash -n scripts/gui-smoke.sh
      - run: NBRG_RUN_GUI_SMOKE=1 cargo test --test gui_smoke -- --nocapture

  release-artifact-scripts:
    name: Release artifact scripts (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: bash -n packaging/release/checksums.sh
      - run: bash -n packaging/release/sbom.sh
      - run: |
          mkdir -p dist
          touch dist/placeholder.txt
          bash packaging/release/sbom.sh dist
          bash packaging/release/checksums.sh dist

  docs-site:
    name: Docs site
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install mdbook --locked
      - run: mdbook build docs

  wan-netns-smoke:
    name: WAN netns smoke (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && vars.NBRG_RUN_NETNS_TESTS == '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: bash -n scripts/wan-netns-smoke.sh
      - run: NBRG_RUN_NETNS_TESTS=1 cargo test --test wan_netns -- --nocapture
